<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>枢台 · 工作台</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>

<div class="shell">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><span id="brand-name">枢台</span></div>
    <div class="sign" id="brand-sign">AI 协作工作台 · 管理你跟 AI 的每一次协作</div>
    <nav class="nav" id="nav">
      <!-- 导航由 JS 渲染 -->
    </nav>
    <!-- 主题切换 -->
    <div class="theme-switcher" id="theme-switcher">
      <button class="theme-dot active" data-theme="pink" title="粉色主题" style="background:#c4507a"></button>
      <button class="theme-dot" data-theme="blue" title="蓝色主题" style="background:#4a7ab5"></button>
      <button class="theme-dot" data-theme="dark" title="深色主题" style="background:#161628;border:1px solid #3a3a5a"></button>
    </div>
    <div class="loc">
      <span class="sbadge ok" id="status-badge">● 在线</span>
      <br><span style="display:inline-flex;align-items:center;gap:4px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" width="10" height="10"><path d="M12 22s-7-6-7-12a7 7 0 0114 0c0 6-7 12-7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span id="loc-url">localhost:8765</span>
      </span>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="main" id="main">
    <!-- 页面由 JS 动态渲染 -->
  </main>
</div>

<!-- FAB 灵感速记 -->
<div class="fab" id="fab" title="灵感速记">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" width="24" height="24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12c1 1 1 2 1 3h6c0-1 0-2 1-3a7 7 0 00-4-12z"/></svg>
</div>
<div class="fab-panel" id="fab-panel">
  <div class="fp-hd">
    <span style="display:flex;align-items:center;gap:8px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" width="16" height="16"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12c1 1 1 2 1 3h6c0-1 0-2 1-3a7 7 0 00-4-12z"/></svg>
      灵感速记
    </span>
    <span class="fp-close" id="fp-close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" width="14" height="14"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
    </span>
  </div>
  <textarea id="fp-input" placeholder="随手记一个灵感，回车或点保存…"></textarea>
  <div class="fp-acts">
    <button class="btn brand sm" id="fp-save">保存</button>
    <span class="fp-stat" id="fp-stat">0 条</span>
  </div>
  <div class="fp-list" id="fp-list"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 脚本 -->
<script type="module" src="/js/main.js"></script>
</body>
</html>
